name: Discover audio sources
on:
  workflow_dispatch:
  push:
    paths:
      - discover.py
      - .github/workflows/discover.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 discover.py > discover_log.txt 2>&1 || true
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add discover_log.txt
          git diff --cached --quiet || git commit -m "Discovery log"
          git push
