name: Discover number audio
on:
  workflow_dispatch:
  push:
    paths:
      - discover2.py
      - .github/workflows/discover2.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 discover2.py > discover2_log.txt 2>&1 || true
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add discover2_log.txt
          git diff --cached --quiet || git commit -m "Discovery log 2"
          git push
