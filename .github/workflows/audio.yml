name: Download audio
on:
  workflow_dispatch:
  push:
    paths:
      - download_audio.py
      - .github/workflows/audio.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 download_audio.py
      - name: Commit audio files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || git commit -m "Add audio files"
          git push
