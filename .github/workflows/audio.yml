name: Download audio
on:
  workflow_dispatch:
  push:
    paths:
      - download_audio.py
      - .github/workflows/audio.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          python3 download_audio.py > download_log.txt 2>&1 || true
          curl -sSI https://www.arabicreadingcourse.com/audio/isolated-letters/ba.mp3 >> download_log.txt 2>&1 || true
          ls -R audio >> download_log.txt 2>&1 || true
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add audio files and download log"
          git push
